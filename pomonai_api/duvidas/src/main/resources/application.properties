spring.application.name=duvidas

# Segredos (senha do banco e chave da API) ficam em secrets.properties,
# que está no .gitignore. Modelo: secrets.properties.example
spring.config.import=optional:classpath:secrets.properties

# MySQL
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/pomonaidb?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA (o schema fica por conta do Flyway)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Google AI Studio (Gemini)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001

# Tentativas de nova chamada ao Gemini: falha rápido em vez de esperar minutos
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=2000ms
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=10000ms

# ChromaDB
spring.ai.vectorstore.chroma.client.host=http://localhost
spring.ai.vectorstore.chroma.client.port=8000
spring.ai.vectorstore.chroma.collection-name=pomonai_estudos
spring.ai.vectorstore.chroma.initialize-schema=true