<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>FAQ - Relatório de Dúvidas</title>
    <style>
        @page {
            size: A4 portrait;
            margin: 25mm 15mm 20mm 15mm;

            @top-center {
                content: "SENAI - Relatório de Perguntas Frequentes (FAQ)";
                font-family: Helvetica, sans-serif;
                font-size: 8pt;
                color: #718096;
            }

            @bottom-right {
                content: "Página " counter(page) " de " counter(pages);
                font-family: Helvetica, sans-serif;
                font-size: 8pt;
                color: #718096;
            }

            @bottom-left {
                content: "Gerado automaticamente pelo Sistema de Dúvidas";
                font-family: Helvetica, sans-serif;
                font-size: 8pt;
                color: #a0aec0;
            }
        }

        body {
            font-family: Helvetica, sans-serif;
            color: #2d3748;
            margin: 0;
            padding: 0;
            font-size: 11pt;
            line-height: 1.5;
        }

        .header-title {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #141a6b;
            padding-bottom: 15px;
        }

        .header-title h1 {
            color: #141a6b;
            font-size: 20pt;
            margin: 0 0 5px 0;
        }

        .header-title p {
            color: #4a5568;
            font-size: 10pt;
            margin: 0;
        }

        .faq-item {
            margin-bottom: 18px;
            padding: 14px 18px;
            border-left: 4px solid #141a6b;
            background-color: #f7fafc;
            page-break-inside: avoid;
        }

        .faq-question {
            font-size: 12pt;
            font-weight: bold;
            color: #141a6b;
            margin-bottom: 6px;
        }

        .faq-meta {
            font-size: 8.5pt;
            color: #718096;
            margin-bottom: 8px;
        }

        .faq-categoria {
            font-weight: bold;
            color: #2b6cb0;
        }

        .faq-answer {
            color: #4a5568;
            font-size: 10.5pt;
            margin: 0 0 6px 0;
            white-space: pre-wrap;
        }

        .faq-answer-label {
            font-weight: bold;
            color: #141a6b;
        }

        .faq-pending {
            color: #a0aec0;
            font-style: italic;
            font-size: 10pt;
            margin: 0;
        }

        .empty-message {
            text-align: center;
            font-style: italic;
            color: #a0aec0;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <div class="header-title">
        <h1>Perguntas e Respostas (FAQ)</h1>
        <p>Listagem completa das dúvidas registradas no banco de dados</p>
    </div>

    <div th:if="${not #lists.isEmpty(duvidas)}">
        <div class="faq-item" th:each="d, stat : ${duvidas}">
            <div class="faq-question">
                <span th:text="${stat.count} + '. ' + ${d.texto}">1. Texto da dúvida</span>
            </div>

            <div class="faq-meta">
                <span th:if="${d.dataHora != null}">
                    Enviada em:
                    <span th:text="${#temporals.format(d.dataHora, 'dd/MM/yyyy HH:mm')}">17/10/2026 09:00</span>
                </span>
                <span th:if="${d.categoria != null}">
                    | Categoria:
                    <span class="faq-categoria" th:text="${d.categoria.nome}">Programação</span>
                </span>
                <span th:if="${d.categoria == null}">| Sem categoria</span>
            </div>

            <!-- Resposta do professor (tem prioridade) -->
            <p class="faq-answer" th:if="${not #strings.isEmpty(d.respostaProfessor)}">
                <span class="faq-answer-label">Resposta do professor:</span>
                <span th:text="${d.respostaProfessor}">Resposta</span>
            </p>

            <!-- Resposta da IA -->
            <p class="faq-answer" th:if="${not #strings.isEmpty(d.respostaIa)}">
                <span class="faq-answer-label">Resposta da IA:</span>
                <span th:text="${d.respostaIa}">Resposta</span>
            </p>

            <!-- Sem nenhuma resposta -->
            <p class="faq-pending"
               th:if="${#strings.isEmpty(d.respostaProfessor) and #strings.isEmpty(d.respostaIa)}">
                Ainda sem resposta.
            </p>
        </div>
    </div>

    <div class="empty-message" th:if="${#lists.isEmpty(duvidas)}">
        <p>Nenhuma dúvida cadastrada no momento.</p>
    </div>

</body>
</html>
